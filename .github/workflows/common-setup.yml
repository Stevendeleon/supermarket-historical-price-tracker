name: Common Setup

on:
  workflow_call:
    inputs:
      go-version:
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true

      - name: Install dependencies
        run: go mod download